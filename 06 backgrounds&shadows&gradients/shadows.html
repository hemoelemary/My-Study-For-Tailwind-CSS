<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Backgrounds & Shadows</title>
  </head>
  <body>
   
    <!-- Shadows -->
    <!-- https://tailwindcss.com/docs/drop-shadow -->
    <div class="flex flex-wrap">
      <div class="w-[400px] mt-10 ml-4 p-3 shadow-md">Shadow Medium</div>
      <div class="w-[400px] mt-10 ml-7 p-3 shadow-lg">Shadow Large</div>
      <div class="w-[400px] mt-10 ml-7 p-3 shadow-xl">Shadow xLarge</div>
      <div class="w-[400px] mt-10 ml-7 p-3 shadow-2xl">Shadow 2xLarge</div>
      <div class="w-[400px] mt-10 ml-7 p-3 shadow-inner">inner</div>
      <!--colors to shadow-->
      <div class="w-[400px] mt-10 ml-7 p-3 shadow-lg shadow-teal-300/40">inner</div>
    </div>
    </body>
</html>
