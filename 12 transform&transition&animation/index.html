<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Transform transition animation</title>
  </head>
<body>
<!--transition-->
<button class="p-5 text-white bg-blue-100 hover:bg-blue-700">click me</button>
<button class="p-5  ml-5 bg-blue-500 transition hover:bg-teal-500 duration-300 ease-in-out delay-150 text-white">m</button>
<!--transform-->
<button class="p-5 ml-5 text-white bg-blue-500 transition ease-in-out delay-140 duration-1000 hover:-translate-y-1 hover:scale--110 hover:bg-teal-500">Transform</button>
<!--animation-->
<div class="flex justify-center">
    <div class="p-20 ml-20 mt-20 w-20 bg-teal-200 animate-spin">spin</div>
    <div class="p-20 ml-20 mt-20 w-20 bg-teal-200 animate-ping">ping</div>
    <div class="p-20 ml-20 mt-20 w-20 bg-teal-200 animate-pulse">pulse</div>
    <div class="p-20 ml-20 mt-20 w-20 bg-teal-200 animate-bounce">pulse</div>



</div>
</body>
</html>
