<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Backgrounds</title>
  </head>
  <body>
    <div class="border-2 w-1/2 border-green-500/2 m-10">x</div>
    <div class="border-4 w-1/2 border-green-500 m-10">x</div>
    <div class="border-4 w-1/2 border-red-500 m-10">x</div>
    <div class="border-x-4 w-1/2 border-red-500 m-10">Border to x axis</div>
    <div class="border-y-4 border-red-200 m-10">x</div>
    <div class="border-r-4 border-teal-400 mb-5">border right</div>
    <div class="border-l-4 border-teal-400 mb-5">border left</div>
    <div class="border-t-4 border-teal-400 mb-5">border top</div>
    <div class="border-b-4 border-teal-400 mb-3">border top</div>
    <div class="border-2 border-green-200 m-10">
        <div class="w-96 m-2 p-5 bg-teal-200 rounded">border rounded</div>
        <div class="w-96 m-2 p-5 bg-teal-200 rounded-lg">border rounded lg</div>
        <div class="w-96 m-2 p-5 bg-teal-200 rounded-xl">border rounded xl</div>
        <div class="w-96 m-2 p-5 bg-teal-200 rounded-2xl">border rounded 2xl</div>
        <div class="w-96 m-2 p-5 bg-teal-200 rounded-3xl">border rounded 3xl</div>
        <div class="w-96 m-2 p-5 bg-teal-200 rounded-full">border rounded 3xl</div>
        <!--specific sides-->
        <div class="w-96 m-3 border-t-8 p-5 border-blue-200  rounded-t-xl">rounded</div>
    </div>
</body>
</html>
